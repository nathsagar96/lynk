services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lynk
      POSTGRES_USER: lynk
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lynk -d lynk" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
