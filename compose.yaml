# Local development database. spring-boot-docker-compose finds this file, starts the service and
# wires the datasource automatically, so no datasource properties are needed for local runs.
#
# Test runs are unaffected: spring.docker.compose.skip.in-tests defaults to true.
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=lynk'
      - 'POSTGRES_USER=lynk'
      - 'POSTGRES_PASSWORD=lynk'
    ports:
      - '5432'
    volumes:
      - 'lynk-dev-db:/var/lib/postgresql'

  # Reference identity provider for local runs. It imports the same realm the integration test uses,
  # so ./mvnw spring-boot:run talks to the realm the tests prove. Mounted from src/test/resources
  # because that is the only copy: the realm is a test/dev fixture, and Keycloak's --import-realm
  # wants it on the container's import path.
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.8'
    command: [ 'start-dev', '--import-realm' ]
    environment:
      # Keycloak 26 bootstraps the master-realm admin from these, replacing KEYCLOAK_ADMIN*.
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
    ports:
      # 8081 on the host: 8080 is the app. Matches the default lynk issuer-uri.
      - '8081:8080'
    volumes:
      - './src/test/resources/keycloak/lynk-realm.json:/opt/keycloak/data/import/lynk-realm.json:ro'

volumes:
  lynk-dev-db:
