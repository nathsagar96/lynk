spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  # The compose dependency is for local development only; in production it is pointed at a real
  # database and must never cause the app to shell out to Docker.
  docker:
    compose:
      enabled: false

  # No default: production must be told which realm mints its tokens, and the issuer has to be
  # reachable from the app, since the JWK set is fetched from it.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

# The generated contract is a development aid; production does not publish its API surface.
springdoc:
  api-docs:
    enabled: false

server:
  shutdown: graceful
