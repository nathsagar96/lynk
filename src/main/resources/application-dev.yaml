spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/lynk

logging:
  level:
    root: INFO
    ly.lynk: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  tracing:
    sampling:
      probability: 1.0

app:
  snowflake:
    machine-id: 0
  url:
    default-expiry: 1d