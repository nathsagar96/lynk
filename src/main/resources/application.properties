spring.application.name=lynk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mvc.problemdetails.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The single source of the public host. Every generated URL (short URLs and the
# Location header) is built from this value; the incoming request host is ignored.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.default-alias-length=${APP_DEFAULT_ALIAS_LENGTH:7}
app.max-retry-attempts=${APP_MAX_RETRY_ATTEMPTS:5}
app.reserved-aliases=api,actuator,error

management.endpoints.web.exposure.include=health,info
