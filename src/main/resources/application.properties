spring.application.name=lynk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mvc.problemdetails.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# The single source of the public host. Every generated URL (short URLs and the
# Location header) is built from this value; the incoming request host is ignored.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.default-alias-length=${APP_DEFAULT_ALIAS_LENGTH:7}
app.max-retry-attempts=${APP_MAX_RETRY_ATTEMPTS:5}
app.reserved-aliases=api,actuator,error
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Expired URL background cleanup
app.cleanup.cron=${APP_CLEANUP_CRON:0 0 * * * *}
app.cleanup.batch-size=${APP_CLEANUP_BATCH_SIZE:1000}
app.cleanup.max-batches-per-run=${APP_CLEANUP_MAX_BATCHES_PER_RUN:100}

# OAuth2 Resource Server / Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lynk}

management.endpoints.web.exposure.include=health,info
