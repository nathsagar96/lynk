spring.application.name=lynk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mvc.problemdetails.enabled=true

app.default-alias-length=7
app.max-retry-attempts=5
app.cache-ttl=1h

# Concurrency & Virtual Threads
spring.threads.virtual.enabled=true
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=5000ms
server.tomcat.keep-alive-timeout=60000ms

# Redis configuration
spring.data.redis.timeout=750ms

# Asynchronous click buffering
app.clicks.flush-interval=5s
app.clicks.batch-size=1000

# Expired URL background cleanup
app.cleanup.batch-size=1000
app.cleanup.max-batches-per-run=100

# Management & metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
