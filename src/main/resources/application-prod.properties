server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.flyway.enabled=${FLYWAY_ENABLED:true}

app.base-url=${APP_BASE_URL}
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=2000ms

logging.structured.format.console=${LOG_FORMAT:ecs}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.01}
